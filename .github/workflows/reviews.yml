name: Repository reviews

on:
  workflow_dispatch:

# Event runs may coalesce; each run reads the complete current source.
# GitHub's default single pending slot is intentional here.
concurrency:
  group: repository-reviews
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: vars.REPO_REVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify parsing and rating calculation
        run: python3 -m unittest discover -s tests -p 'test_reviews.py' -v
      - name: Reconcile reviews and publish an atomic snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repo_reviews.py sync
