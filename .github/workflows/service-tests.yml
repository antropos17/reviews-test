name: Service regression checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'feedback-service/**'
      - '.github/workflows/service-tests.yml'
      - '.github/workflows/transparency.yml'
  push:
    branches: [main]
    paths:
      - 'feedback-service/**'
      - '.github/workflows/service-tests.yml'
      - '.github/workflows/transparency.yml'

permissions:
  contents: read

concurrency:
  group: service-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: feedback-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install service dependencies
        run: python -m pip install -r requirements.txt
      - name: Check service behavior and checkpoint restore
        run: python -m unittest discover -s tests -v
      - name: Check browser request and navigation behavior
        # Node.js is provided by the hosted Ubuntu runner image.
        run: node --test tests/browser.test.cjs
